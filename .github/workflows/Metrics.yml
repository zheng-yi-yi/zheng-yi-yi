name: GitHub Metrics
# 此开源项目地址 https://github.com/lowlighter/metrics
on:
  # Schedule weekly updates (每周一 UTC 00:00 = 北京时间周一 08:00)
  schedule: [{cron: "0 0 * * 1"}]
  # Run workflow manually
  workflow_dispatch:
  # 仅在 workflow 本身变更时触发，避免每次改 README 都跑一遍
  push:
    branches: ["main"]
    paths: [".github/workflows/Metrics.yml"]

# 防止定时任务与手动/推送触发同时运行导致提交冲突
concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # 基础信息（README.md 中唯一引用的图：github-metrics/base.svg）
      - name: base
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/base.svg
          # GitHub token
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: zheng-yi-yi
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"
          # 🧮 Repositories traffic
          plugin_traffic: yes
          # 👨‍💻 Lines of code changed
          plugin_lines: yes
          # 🙋 Introduction
          plugin_introduction: yes
